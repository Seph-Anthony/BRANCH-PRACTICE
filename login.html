<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Traffic Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Anton+SC&family=Caesar+Dressing&family=DM+Serif+Display:ital@0;1&family=Funnel+Display:wght@300..800&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=GFS+Didot&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&family=Stack+Sans+Text:wght@200..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Unna:ital,wght@0,400;0,700;1,400;1,700&family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <script src="https://unpkg.com/lucide@latest"></script>

    <div class="login-container">
      <div class="lihok-outer">
        <div class="logo">
          <img src="images/logo-login.png" class="clogo" />
        </div>
        <div class="title">
          <p class="lihok">Lihok Padulong</p>
          <p class="mitcom">MITCOMMMMMMMM MINGLANILLA</p>
        </div>
      </div>

      <!-- LOGIN TO YOUR ACOUNT NA PART -->
      <div class="login-title">
        <div class="inner-login">
          <p class="login-des">Log in to your Accccount</p>
        </div>
        <div class="inner-welcome-back">
          <p class="login-welcome-des">
            Welcome back! Select a method to log in:
          </p>
        </div>
      </div>
      <form class="login-form">
        <div class="input-group">
          <i data-lucide="mail" class="input-icon"></i>
          <input type="email" placeholder="Email address" />
        </div>

        <div class="input-group">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" placeholder="Password" />
          <i data-lucide="eye-off" class="view-icon"></i>
        </div>
        <div class="remember-forgot">
          <div class="inner-remember">
            <input type="checkbox" name="remember" />
            <label>Remember me</label>
          </div>

          <div class="inner-forgot">
            <a class="forgot-link" href="#">Forgot Password</a>
          </div>
        </div>
        <button type="submit" class="login-btn">Log In</button>
      </form>
      <div class="signup-footer">
        <p class="signup-text">Don't have an account?</p>
        <a href="#" class="signup-link">Sign up here</a>
      </div>
    </div>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
